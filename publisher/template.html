<!DOCTYPE html>
<html xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" lang="es">
  <head>
    <title></title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
<!--[if mso]>
<xml><w:WordDocument xmlns:w="urn:schemas-microsoft-com:office:word"><w:DontUseAdvancedTypographyReadingMail/></w:WordDocument>
<o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch><o:AllowPNG/></o:OfficeDocumentSettings></xml>
<![endif]-->
    <style>
      * { box-sizing: border-box }
      body { margin: 0; padding: 0 }
      a[x-apple-data-detectors] { color: inherit !important; text-decoration: inherit !important }
      #MessageViewBody a { color: inherit; text-decoration: none }
      p { line-height: inherit }
      .desktop_hide, .desktop_hide table { mso-hide: all; display: none; max-height: 0; overflow: hidden }
      .image_block img+div { display: none }
      sub, sup { font-size: 75%; line-height: 0 }
      
      /* Estilos del contenido inyectado */
      .content-body h2 { margin: 0 0 10px 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 20px; line-height: 1.3; font-weight: 700; color: #000 }
      .content-body h3 { margin: 0 0 8px 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.4; font-weight: 700; color: #000 }
      .content-body p { margin: 0 0 16px 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #000 }
      .content-body a { color: #000; text-decoration: underline }
      .content-body img { display: block; width: 100%; max-width: 100%; height: auto; border: 0 }
      .content-body ul, .content-body ol { margin: 0 0 16px 0; padding-left: 22px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #000 }
      .content-body li { margin: 0 0 8px 0 }
      .content-body hr { border: 0; border-top: 1px solid #e5e5e5; margin: 24px 0 }
      
      @media (max-width:520px) {
        .desktop_hide table.icons-outer { display: inline-table !important }
        .row-content { width: 100% !important }
        .stack .column { width: 100%; display: block }
        .mobile_hide { min-height: 0; max-height: 0; max-width: 0; display: none; overflow: hidden; font-size: 0 }
        .desktop_hide, .desktop_hide table { display: table !important; max-height: none !important }
        .row-footer .column-1 .block-1.text_block td.pad, .row-footer .column-1 .block-2.text_block td.pad { padding-left: 20px !important; padding-right: 20px !important }
        .row-header .block-1 td.px-20 { padding-left: 20px !important; padding-right: 20px !important }
        .row-body .col-pad { padding-left: 20px !important; padding-right: 20px !important }
      }
    </style>
  </head>
  <body class="body" style="margin:0;padding:0;-webkit-text-size-adjust:none;text-size-adjust:none;background-color:#fff">

    <!-- Preheader Inyectado -->
    <div style="display:none;font-size:1px;color:#fff;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden">{{PREHEADER}}&#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847;</div>

    <table class="nl-container" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace:0;mso-table-rspace:0;background-color:#fff">
      <tbody>
        <tr>
          <td>
            <!-- CABECERA -->
            <table class="row row-header" align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation">
              <tbody>
                <tr>
                  <td>
                    <table class="row-content stack" align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace:0;mso-table-rspace:0;background-color:#fff;width:500px;margin:0 auto" width="500">
                      <tbody>
                        <tr>
                          <td class="column column-1" width="100%" style="mso-table-lspace:0;mso-table-rspace:0;font-weight:400;text-align:left;vertical-align:top">
                            <table width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation">
                              <tbody>
                                <tr>
                                  <td class="col-pad" style="padding-bottom:5px;padding-top:5px">
                                    <table class="html_block block-1" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation">
                                      <tbody>
                                        <tr>
                                          <td class="pad">
                                            <div style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;text-align:center" align="center">
                                              <table width="100%" cellspacing="0" cellpadding="0">
                                                <tbody>
                                                  <tr><td style="font-size:1px;line-height:1px;height:28px" height="28">&nbsp;</td></tr>
                                                  <tr>
                                                    <td class="px-20" style="padding:0 35px">
                                                      <table width="100%" cellspacing="0" cellpadding="0">
                                                        <tbody>
                                                          <tr>
                                                            <td valign="middle" align="left">
                                                              <table cellspacing="0" cellpadding="0" align="left">
                                                                <tbody>
                                                                  <tr>
                                                                    <td valign="middle" width="36" style="padding-right:10px">
                                                                      <img style="vertical-align:middle;display:block;border:0" src="{{LOGO_URL}}" width="36" height="36" alt="Waise Studio" />
                                                                    </td>
                                                                    <td valign="middle" style="font:700 16px/20px 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#000;">
                                                                      WAISE STUDIO
                                                                    </td>
                                                                  </tr>
                                                                </tbody>
                                                              </table>
                                                            </td>
                                                            <td valign="middle" align="right" style="padding-left:15px">
                                                              <table style="margin-left:auto" cellspacing="0" cellpadding="0">
                                                                <tbody>
                                                                  <tr>
                                                                    <td style="font:500 10px/16px 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#fff;letter-spacing:0.1em;text-transform:uppercase;border-radius:4px;padding:6px 8px 5px" align="center" bgcolor="#000000">
                                                                      {{ISSUE_TAG}}
                                                                    </td>
                                                                    <td width="8"></td>
                                                                    <td style="font:500 10px/16px 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#555;letter-spacing:0.1em;text-transform:uppercase;border-radius:4px;padding:6px 8px 5px" align="center" bgcolor="#f4f4f4">
                                                                      ⏱ {{READING_TIME}}
                                                                    </td>
                                                                  </tr>
                                                                </tbody>
                                                              </table>
                                                            </td>
                                                          </tr>
                                                        </tbody>
                                                      </table>
                                                    </td>
                                                  </tr>
                                                  <tr><td style="font-size:1px;line-height:1px;height:24px" height="24">&nbsp;</td></tr>
                                                  <tr>
                                                    <td style="padding:0 35px">
                                                      <table width="100%" cellspacing="0" cellpadding="0">
                                                        <tbody><tr><td height="1" style="font-size:1px;line-height:1px;height:1px;background-color:#e5e5e5">&nbsp;</td></tr></tbody>
                                                      </table>
                                                    </td>
                                                  </tr>
                                                </tbody>
                                              </table>
                                            </div>
                                          </td>
                                        </tr>
                                      </tbody>
                                    </table>
                                  </td>
                                </tr>
                              </tbody>
                            </table>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </td>
                </tr>
              </tbody>
            </table>

            <!-- CUERPO PRINCIPAL -->
            <table class="row row-body" align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation">
              <tbody>
                <tr>
                  <td>
                    <table class="row-content stack" align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace:0;mso-table-rspace:0;background-color:#fff;width:500px;margin:0 auto" width="500">
                      <tbody>
                        <tr>
                          <td class="column column-1" width="100%" style="mso-table-lspace:0;mso-table-rspace:0;font-weight:400;text-align:left;vertical-align:top">
                            <table width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation">
                              <tbody>
                                <tr>
                                  <td class="col-pad" style="padding:32px 35px 8px 35px">
                                    <table class="text_block block-1" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation">
                                      <tbody>
                                        <tr>
                                          <td class="pad">
                                            <div class="content-body" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#000;text-align:left">
{{CONTENT_BODY}}
                                            </div>
                                          </td>
                                        </tr>
                                      </tbody>
                                    </table>
                                  </td>
                                </tr>
                              </tbody>
                            </table>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </td>
                </tr>
              </tbody>
            </table>

            <!-- PIE DE PÁGINA Y FIRMA -->
            <table class="row row-footer" align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation">
              <tbody>
                <tr>
                  <td>
                    <table class="row-content stack" align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace:0;mso-table-rspace:0;background-color:#fff;width:500px;margin:0 auto" width="500">
                      <tbody>
                        <tr>
                          <td class="column column-1" width="100%">
                            <table width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation">
                              <tbody>
                                <tr>
                                  <td class="col-pad" style="padding:16px 35px 32px 35px">
                                    <div style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#000">
                                      <p style="margin:0">Nos leemos mañana,</p>
                                      <p style="margin:0"><strong>Waise Studio</strong></p>
                                    </div>
                                  </td>
                                </tr>
                                <tr>
                                  <td class="col-pad" style="padding:0 35px">
                                    <table width="100%" cellspacing="0" cellpadding="0">
                                      <tbody><tr><td height="1" style="font-size:1px;line-height:1px;background-color:#e5e5e5">&nbsp;</td></tr></tbody>
                                    </table>
                                  </td>
                                </tr>
                                <tr>
                                  <td class="col-pad" style="padding:24px 35px 8px 35px">
                                    <img style="display:block;border:0;margin:0 auto" src="{{LOGO_URL}}" width="40" height="40" alt="Waise Studio" />
                                  </td>
                                </tr>
                                <tr>
                                  <td class="col-pad" style="padding:8px 35px 4px 35px">
                                    <div style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:10px;line-height:1.6;color:#555;text-align:center">
                                      <p style="margin:0"><strong>Waise Studio</strong> · Al día con la IA</p>
                                    </div>
                                  </td>
                                </tr>
                                <tr>
                                  <td class="col-pad" style="padding:4px 35px 36px 35px">
                                    <div style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:10px;line-height:1.8;color:#555;text-align:center;letter-spacing:1px">
                                      <p style="margin:0">
                                        <a href="{{unsubscribe_url}}" target="_blank" style="text-decoration:underline;color:#555">DESUSCRIBIRSE</a>
                                      </p>
                                    </div>
                                  </td>
                                </tr>
                              </tbody>
                            </table>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </td>
                </tr>
              </tbody>
            </table>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
