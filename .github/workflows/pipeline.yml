name: Executer Pipeline Newsletter

on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Pipeline Completo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUB_ID: ${{ secrets.BEEHIIV_PUB_ID }}
        run: |
          python3 main.py "$GEMINI_API_KEY" "$BEEHIIV_API_KEY" "$BEEHIIV_PUB_ID"
          
      # NUEVO PASO: Guardar los archivos generados antes de destruir la máquina
      - name: Guardar Gráficas y Borradores (Artifacts)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Archivos-Newsletter
          path: |
            charts/
            drafts/
            sources/
            SCRAPER_LOGS.md
